services:
  mongo:
    image: mongo:7
    ports: ["27019:27017"]
    volumes: [knowflow-mongo:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 15
  server:
    build: ./server
    environment:
      PORT: 4200
      MONGO_URI: mongodb://mongo:27017/knowflow_ai
      CLIENT_ORIGIN: http://localhost:5173
      LLM_MODE: demo
    ports: ["4200:4200"]
    depends_on:
      mongo:
        condition: service_healthy
  client:
    build: ./client
    ports: ["5173:80"]
    depends_on: [server]
volumes:
  knowflow-mongo:
